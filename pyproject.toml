[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "argos-agent"
version = "0.3.0"
description = "Argos (Ἄργος) - Lightweight Multi-Agent & Remote SSH Orchestrator for Coding Agents (Claude Code, agy, codex)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Developer" }
]
dependencies = [
    "paramiko>=3.0.0",
    "pywinpty>=2.0.0; sys_platform == 'win32'",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "psutil>=5.9.0",
    "requests>=2.28.0",
    "tornado>=6.3.0",
    "websocket-client>=1.6.0"
]

[project.scripts]
argos = "server_helper.cli:main"
argos-sh = "server_helper.cli:main"
server-helper = "server_helper.cli:main"
shmux = "server_helper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
